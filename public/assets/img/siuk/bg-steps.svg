<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7367f0" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#7367f0" stop-opacity=".04"/>
      <stop offset="1" stop-color="#28c76f" stop-opacity=".10"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#7367f0" fill-opacity=".16"/>
    </pattern>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 40) scale(320)">
      <stop offset="0" stop-color="#7367f0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7367f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1140 380) scale(340)">
      <stop offset="0" stop-color="#28c76f" stop-opacity=".2"/>
      <stop offset="1" stop-color="#28c76f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dasar -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>

  <!-- jalur alur -->
  <path d="M-20 300 C 180 200, 300 360, 480 260 S 760 140, 900 230 S 1120 300, 1240 180"
        fill="none" stroke="#7367f0" stroke-opacity=".22" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <g fill="#7367f0" fill-opacity=".28">
    <circle cx="150" cy="248" r="7"/>
    <circle cx="480" cy="260" r="7"/>
    <circle cx="790" cy="170" r="7"/>
  </g>
  <circle cx="1080" cy="265" r="9" fill="#28c76f" fill-opacity=".45"/>

  <!-- medali sertifikat -->
  <g transform="translate(1065 70)" opacity=".16">
    <path d="M-22 40 L-34 100 L-10 88 L0 110 L12 46 Z" fill="#7367f0"/>
    <path d="M22 40 L34 100 L10 88 L0 110 L-12 46 Z" fill="#5a4fd6"/>
    <circle r="46" fill="#7367f0"/>
    <circle r="34" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M-14 0 L-4 11 L16 -10" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- lembar dokumen -->
  <g transform="translate(40 300) rotate(-12)" opacity=".13">
    <rect width="90" height="114" rx="10" fill="#7367f0"/>
    <rect x="16" y="22" width="58" height="7" rx="3.5" fill="#fff"/>
    <rect x="16" y="40" width="44" height="7" rx="3.5" fill="#fff"/>
    <rect x="16" y="58" width="52" height="7" rx="3.5" fill="#fff"/>
    <circle cx="66" cy="92" r="11" fill="#fff"/>
  </g>

  <!-- bentuk dekoratif -->
  <circle cx="640" cy="-30" r="110" fill="none" stroke="#7367f0" stroke-opacity=".1" stroke-width="26"/>
  <rect x="300" y="40" width="34" height="34" rx="9" transform="rotate(18 317 57)" fill="#ff9f43" fill-opacity=".18"/>
  <rect x="930" y="330" width="26" height="26" rx="7" transform="rotate(-14 943 343)" fill="#7367f0" fill-opacity=".18"/>
  <path d="M590 350 l10 -18 l10 18 z" fill="#28c76f" fill-opacity=".22"/>
  <g stroke="#ff9f43" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
    <path d="M210 70 v16 M202 78 h16"/>
    <path d="M860 60 v12 M854 66 h12"/>
  </g>
</svg>
