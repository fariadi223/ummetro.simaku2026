; Pool PHP-FPM untuk aplikasi Tracer Study.
;
; Berkas ini menggantikan www.conf bawaan image php:8.2-fpm (lihat Dockerfile),
; jadi seluruh direktif pool ditulis lengkap di sini -- termasuk user, group,
; dan listen -- supaya tidak bergantung pada urutan muat berkas di php-fpm.d.

[www]

user = www-data
group = www-data

; Dipanggil nginx lewat fastcgi_pass tracer-app:9000 (lihat nginx/default.conf).
listen = 9000

pm = dynamic
pm.max_children = 40
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 500
pm.process_idle_timeout = 10s

listen.backlog = 1024
request_terminate_timeout = 60s

pm.status_path = /fpm-status
ping.path = /fpm-ping
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 5s
