[supervisord]
nodaemon=true
user=root

logfile=/dev/null
logfile_maxbytes=0

pidfile=/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize

priority=10

autostart=true
autorestart=true

startsecs=2
startretries=5

stopasgroup=true
killasgroup=true

stopsignal=QUIT

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-worker]
; Koneksi antrian mengikuti QUEUE_CONNECTION (redis). --max-time & --max-jobs
; membuat worker didaur ulang berkala supaya memori tidak menumpuk dan kode
; baru ikut terpakai.
command=/usr/local/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=120 --max-time=3600 --max-jobs=1000

directory=/var/www/html

user=www-data

priority=20

autostart=true
autorestart=true

startsecs=2
startretries=5

stopasgroup=true
killasgroup=true

stopsignal=TERM

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0